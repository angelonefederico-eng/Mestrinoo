<!DOCTYPE html>
<html lang="it">
<head>
  <style>
  /* Attiva lo scorrimento nativo e fluido su iOS/Android */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow-y: auto !important;
    -webkit-overflow-scrolling: touch;
  }

  /* Assicura che l'iframe o il contenitore principale possa scorrere in entrambe le direzioni */
  main, .tab-content {
    overflow-y: auto !important;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
  }

  /* Evita il blocco dello scorrimento nelle modali */
  .max-h-\[90vh\], .max-h-\[85vh\] {
    max-height: 85vh !important;
    overflow-y: auto !important;
    -webkit-overflow-scrolling: touch;
  }
</style>
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mestrino UTD - Esordienti</title>

  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">

  <style>
    input, select, textarea { font-size: 16px !important; }
    @media (max-width: 640px) {
      .max-h-\[90vh\] { max-height: 95vh !important; }
    }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col md:flex-row">

  <!-- Navigation Bar Mobile -->
  <header class="md:hidden bg-slate-900 border-b border-slate-800 p-3 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-2">
      <img id="team-logo-mobile" src="https://drive.google.com/thumbnail?id=1_dpGnWWsW_9iSoj1hdcgl-t_w4n83wwy&sz=w500" alt="Logo" class="w-8 h-8 rounded-full bg-white p-0.5">
      <span class="font-bold text-xs text-white">Mestrino UTD</span>
    </div>
    <div class="flex items-center gap-1 overflow-x-auto">
      <button onclick="switchTab(this, 'tab-dashboard')" class="nav-btn active-tab px-2.5 py-1.5 rounded-lg bg-blue-600 text-white text-[11px] font-bold whitespace-nowrap">Dashboard</button>
      <button onclick="switchTab(this, 'tab-rosa')" class="nav-btn px-2.5 py-1.5 rounded-lg text-slate-400 hover:bg-slate-800 text-[11px] font-bold whitespace-nowrap">Rosa</button>
      <button onclick="switchTab(this, 'tab-allenamenti')" class="nav-btn px-2.5 py-1.5 rounded-lg text-slate-400 hover:bg-slate-800 text-[11px] font-bold whitespace-nowrap">Allenamenti</button>
      <button onclick="switchTab(this, 'tab-partite')" class="nav-btn px-2.5 py-1.5 rounded-lg text-slate-400 hover:bg-slate-800 text-[11px] font-bold whitespace-nowrap">Partite</button>
    </div>
  </header>

  <!-- Sidebar Desktop -->
  <aside class="hidden md:flex w-64 bg-slate-900 border-r border-slate-800 flex-col p-4 gap-6 shrink-0">
    <div class="flex items-center gap-3">
      <img id="team-logo" src="https://drive.google.com/thumbnail?id=1_dpGnWWsW_9iSoj1hdcgl-t_w4n83wwy&sz=w500" alt="Mestrino United Logo" class="w-12 h-12 object-contain rounded-full bg-white p-0.5 shadow-md">
      <div>
        <h1 class="font-bold text-sm leading-tight text-white">Mestrino United FC</h1>
        <p class="text-xs text-blue-400 font-bold">Esordienti</p>
      </div>
    </div>

    <nav class="flex flex-col gap-2">
      <button onclick="switchTab(this, 'tab-dashboard')" class="nav-btn active-tab flex items-center gap-3 px-3 py-2.5 rounded-lg bg-blue-600 text-white text-xs font-semibold w-full text-left">
        <i class="fa-solid fa-chart-line w-4"></i> Dashboard Stats
      </button>
      <button onclick="switchTab(this, 'tab-rosa')" class="nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 text-xs font-semibold w-full text-left">
        <i class="fa-solid fa-users w-4"></i> Rosa Unica
      </button>
      <button onclick="switchTab(this, 'tab-allenamenti')" class="nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 text-xs font-semibold w-full text-left">
        <i class="fa-solid fa-calendar-check w-4"></i> Allenamenti
      </button>
      <button onclick="switchTab(this, 'tab-partite')" class="nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 text-xs font-semibold w-full text-left">
        <i class="fa-solid fa-trophy w-4"></i> Partite 
      </button>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 bg-slate-950 p-6 overflow-y-auto">
    <div id="status-banner" class="hidden mb-4 p-3 rounded-lg text-xs font-semibold"></div>

    <!-- TAB DASHBOARD -->
    <section id="tab-dashboard" class="tab-content space-y-6">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <h2 class="text-2xl font-bold">Dashboard Generale</h2>
          <p class="text-sm text-slate-400">Risultati, presenze e statistiche individuali</p>
        </div>
        
        <div class="flex items-center gap-3 flex-wrap">
          <label class="text-xs text-slate-400 font-semibold">Filtra Squadra:</label>
          <select id="filter-squadra" onchange="renderAll()" class="bg-slate-800 border border-slate-600 text-slate-200 text-xs rounded-md px-3 py-2 font-bold">
            <option value="ALL">TUTTE LE SQUADRE (Generale)</option>
            <option value="2014">Squadra 2014</option>
            <option value="2015">Squadra 2015</option>
            <option value="MISTA">Squadra MISTA</option>
          </select>

          <button onclick="loadDataFromBackend()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-md text-xs flex items-center gap-2">
            <i class="fa-solid fa-rotate"></i> Aggiorna
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 relative overflow-hidden flex flex-col justify-between">
          <div class="flex justify-between items-start mb-3">
            <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-blue-950 text-blue-400 border border-blue-800">
              <i class="fa-solid fa-clock-rotate-left mr-1"></i> Ultimo Risultato
            </span>
            <span id="last-match-team" class="text-xs font-bold text-amber-400"></span>
          </div>
          <div id="last-match-body">
            <div class="text-center py-6 text-slate-500 text-xs">Nessuna partita completata.</div>
          </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 relative overflow-hidden flex flex-col justify-between">
          <div class="flex justify-between items-start mb-3">
            <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800">
              <i class="fa-solid fa-calendar-day mr-1"></i> Prossimo Impegno
            </span>
            <span id="next-match-team" class="text-xs font-bold text-amber-400"></span>
          </div>
          <div id="next-match-body">
            <div class="text-center py-6 text-slate-500 text-xs">Nessuna prossima partita schedulata.</div>
          </div>
        </div>
      </div>
    </section>

    <!-- TAB ROSA -->
    <section id="tab-rosa" class="tab-content hidden space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-800 text-slate-400 border-b border-slate-700">
            <tr>
              <th class="p-3">ID</th>
              <th class="p-3">Cognome e Nome</th>
              <th class="p-3">Anno</th>
              <th class="p-3">Data di Nascita</th>
              <th class="p-3">Squadra Predefinita</th>
              <th class="p-3">Ruolo</th>
            </tr>
          </thead>
          <tbody id="rosa-table-body" class="divide-y divide-slate-800 text-slate-200"></tbody>
        </table>
      </div>
    </section>

    <!-- TAB ALLENAMENTI -->
    <section id="tab-allenamenti" class="tab-content hidden space-y-4">
      <div id="allenamenti-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    <!-- TAB PARTITE -->
    <section id="tab-partite" class="tab-content hidden space-y-4">
      <div id="partite-container" class="space-y-3"></div>
    </section>
  </main>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTHtbTumZXxcRhVvz_PPgKKD657V48EVneFbKRdAaHdlLQRpGdxAo3EDQuvsQCSPYZ/exec";
    let appData = null;

    function formatDateIT(dateString) {
      if (!dateString) return '-';
      const cleanDate = dateString.split('T')[0];
      if (cleanDate.includes('-')) {
        const parts = cleanDate.split('-');
        if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
      }
      return dateString;
    }

    function switchTab(btn, tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.remove('bg-blue-600', 'text-white');
        b.classList.add('text-slate-400');
      });

      document.getElementById(tabId)?.classList.remove('hidden');
      btn.classList.add('bg-blue-600', 'text-white');
      btn.classList.remove('text-slate-400');
    }

    function showStatusBanner(msg, classes) {
      const b = document.getElementById('status-banner');
      if (!b) return;
      b.className = `mb-4 p-3 rounded-lg text-xs font-semibold ${classes}`;
      b.innerText = msg;
      b.classList.remove('hidden');
    }

    function hideStatusBanner() {
      document.getElementById('status-banner')?.classList.add('hidden');
    }

    function onError(err) {
      showStatusBanner("Errore di caricamento dati: " + (err.message || err), "bg-red-900 text-red-200 border border-red-700");
    }

    function renderAll() {
      if (!appData) return;
      renderDashboard();
      renderRosa();
      renderAllenamenti();
      renderPartite();
    }

    function renderDashboard() {
      const selSquadra = document.getElementById('filter-squadra')?.value || 'ALL';
      const matches = appData.matches || [];
      const completedMatches = matches.filter(m => m.completata).sort((a,b) => new Date(b.data) - new Date(a.data));
      const scheduledMatches = matches.filter(m => !m.completata).sort((a,b) => new Date(a.data) - new Date(b.data));

      const lastMatch = completedMatches[0];
      const lastBody = document.getElementById('last-match-body');
      if (lastMatch && lastBody) {
        lastBody.innerHTML = `
          <div class="flex items-center justify-between mt-2">
            <div class="text-center flex-1">
              <div class="text-sm font-extrabold text-blue-400">Mestrino ${lastMatch.squadra}</div>
            </div>
            <div class="text-center flex-1">
              <div class="text-sm font-extrabold text-slate-300">${lastMatch.avversario}</div>
            </div>
          </div>
          <div class="text-center text-[11px] text-slate-400 mt-3 pt-2 border-t border-slate-800/80">
            ${formatDateIT(lastMatch.data)} (${lastMatch.casaTrasferta})
          </div>
        `;
      }

      const nextMatch = scheduledMatches[0];
      const nextBody = document.getElementById('next-match-body');
      if (nextMatch && nextBody) {
        nextBody.innerHTML = `
          <div class="flex items-center justify-between mt-2">
            <div class="flex-1">
              <div class="text-xs text-emerald-400 font-bold uppercase">${nextMatch.squadra} - ${nextMatch.casaTrasferta}</div>
              <div class="text-lg font-bold text-white mt-0.5">vs ${nextMatch.avversario}</div>
            </div>
            <div class="text-right">
              <div class="text-xs font-bold text-slate-300">${formatDateIT(nextMatch.data)}</div>
              <div class="text-xs text-slate-400 mt-1">Gara ore ${nextMatch.oraIncontro || '-'}</div>
            </div>
          </div>
        `;
      }
    }

    function renderRosa() {
      const tbody = document.getElementById('rosa-table-body');
      if (!tbody || !appData || !appData.players) return;

      tbody.innerHTML = appData.players.map(p => `
        <tr class="hover:bg-slate-800/50 transition">
          <td class="p-3 text-slate-500 font-mono">${p.id}</td>
          <td class="p-3 font-bold text-white">${p.cognome} ${p.nome}</td>
          <td class="p-3 text-slate-400">${p.anno || '-'}</td>
          <td class="p-3 text-slate-300 font-medium">${formatDateIT(p.dataNascita)}</td>
          <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-800 border border-slate-700">${p.squadra}</span></td>
          <td class="p-3 text-slate-400">${p.ruolo || '-'}</td>
        </tr>
      `).join('');
    }

    function renderAllenamenti() {
      const container = document.getElementById('allenamenti-container');
      if (!container || !appData || !appData.trainings) return;
      container.innerHTML = appData.trainings.map(t => `
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
          <div>
            <div class="text-xs font-bold text-blue-400">${t.giorno || ''} ${formatDateIT(t.data)}</div>
            <div class="text-sm font-semibold mt-1 text-white">Ore ${t.ora || '-'} - ${t.campo || '-'}</div>
          </div>
        </div>
      `).join('');
    }

    function renderPartite() {
      const container = document.getElementById('partite-container');
      if (!container || !appData || !appData.matches) return;
      container.innerHTML = appData.matches.map(m => `
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-amber-400">${m.squadra}</span>
              <span class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-300 font-bold border border-slate-700">${m.casaTrasferta}</span>
            </div>
            <div class="text-base font-bold mt-1">vs ${m.avversario}</div>
            <div class="text-xs text-slate-400 mt-1">${formatDateIT(m.data)} - Ritrovo ore ${m.oraRitrovo || '-'}</div>
          </div>
        </div>
      `).join('');
    }

    function loadDataFromBackend() {
      showStatusBanner("Caricamento dati...", "bg-blue-900 text-blue-200 border border-blue-700");
      fetch(APPS_SCRIPT_URL + "?action=getData")
        .then(res => res.json())
        .then(data => {
          appData = data;
          hideStatusBanner();
          renderAll();
        })
        .catch(err => onError(err));
    }

    window.addEventListener('DOMContentLoaded', () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(()=>{});
      }
      loadDataFromBackend();
    });
  </script>
  <script>
  // Inserisce uno stato nella cronologia ogni volta che si apre una modale
  function registerModalHistory() {
    window.history.pushState({ modalOpen: true }, "");
  }

  // Intercetta la pressione del tasto "Indietro" del telefono
  window.addEventListener('popstate', function(event) {
    // Trova ed elimina/nasconde tutte le modali aperte
    const openModals = document.querySelectorAll('.fixed:not(.hidden)');
    if (openModals.length > 0) {
      openModals.forEach(modal => modal.classList.add('hidden'));
    }
  });

  // Aggiorna le tue funzioni di apertura modali per chiamare registerModalHistory()
  // Es: quando apri una modale, aggiungi: registerModalHistory();
</script>
</body>
</html>
